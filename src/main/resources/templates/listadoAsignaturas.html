<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: head('Listado de asignaturas')}"></head>

<body class="bg-light">

    <nav th:replace="~{fragmentos :: navbar}"></nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="bi bi-book-fill"></i> Listado de asignaturas</h2>
            <a href="/altaAsignaturas" class="btn btn-success">
                <i class="bi bi-journal-plus"></i> Nueva asignatura
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Curso</th>
                        <th>Tutor</th>
                        <th>Horas semanales</th>
                        <th>Creditos</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="asig : ${asignaturas}">
                        <td th:text="${asig.id}"></td>
                        <td th:text="${asig.nombre}"></td>
                        <td th:text="${asig.curso}"></td>
                        <td th:text="${asig.tutor}"></td>
                        <td th:text="${asig.horasSemanales}"></td>
                        <td th:text="${asig.creditos}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(asignaturas)}">
                        <td colspan="6" class="text-center text-muted">No hay asignaturas registradas</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragmentos :: scripts}"></div>
</body>
</html>
