<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Fragmento "head": cabecera comun con Bootstrap -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Colegio AEM</title>

    <!-- Bootstrap 5 desde CDN (no hace falta instalar nada) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>

<!-- Fragmento "navbar": menu de navegacion comun -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/inicio">
            <i class="bi bi-mortarboard-fill"></i> Colegio AEM
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/inicio">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/listadoAlumnos">Alumnos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/listadoAsignaturas">Asignaturas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/altaAlumnos">+ Alumno</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/altaAsignaturas">+ Asignatura</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Fragmento "scripts": JS de Bootstrap al final del body -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
