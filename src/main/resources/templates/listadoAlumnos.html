<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: head('Listado de alumnos')}"></head>

<body class="bg-light">

    <nav th:replace="~{fragmentos :: navbar}"></nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="bi bi-people-fill"></i> Listado de alumnos</h2>
            <a href="/altaAlumnos" class="btn btn-success">
                <i class="bi bi-person-plus-fill"></i> Nuevo alumno
            </a>
        </div>

        <!-- Tabla con los alumnos de la BBDD -->
        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Curso</th>
                        <th>Nota media</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Itera sobre la lista de alumnos pasada desde el controlador -->
                    <tr th:each="a : ${alumnos}">
                        <td th:text="${a.id}"></td>
                        <td th:text="${a.nombre}"></td>
                        <td th:text="${a.apellidos}"></td>
                        <td th:text="${a.curso}"></td>
                        <td th:text="${a.notaMedia}"></td>
                        <td th:text="${a.email}"></td>
                    </tr>
                    <!-- Mensaje si no hay alumnos -->
                    <tr th:if="${#lists.isEmpty(alumnos)}">
                        <td colspan="6" class="text-center text-muted">No hay alumnos registrados</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragmentos :: scripts}"></div>
</body>
</html>
